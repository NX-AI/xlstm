[build-system]
requires = ["setuptools>=64", "torch>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xlstm_plus"
version = "0.1.0"
maintainers = [
  { name="LeZeez" },
]
authors = [
  { name="Maximilian Beck", email="beck@ml.jku.at" },
  { name="Korbinian Poeppel", email="poeppel@ml.jku.at" },
  { name="Andreas Auer", email="auer@ml.jku.at" },
]
description = "A fork of the original xLSTM repository with additional features."
readme = "README.md"
license = {file="LICENSE"}
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
keywords = ["xLSTM", "LSTM", "Transformer", "Machine Learning", "Deep Learning", "State Space Models"]
dependencies = [
    "torch>=2.0",
    "einops",
    "numpy",
    "opt_einsum", 
    "omegaconf",
    "transformers",
    "reportlab",
    "joypy",
    "ipykernel",
    "dacite",
    "ftfy", 
    "ninja",
    "huggingface-hub",
    "rich",
    "tokenizers",
    "tqdm",
    "seaborn",
    "mlstm_kernels; python_version >= '3.11'",
]

[tool.uv]
cache-keys = [
    {file = "pyproject.toml"},
    {file = "CMakeLists.txt"},
    {file = "xlstm_plus/blocks/slstm/src/cuda/*.c"},
    {file = "xlstm_plus/blocks/slstm/src/cuda/*.cc"},
    {file = "xlstm_plus/blocks/slstm/src/cuda/*.h"},
    {file = "xlstm_plus/blocks/slstm/src/cuda/*.cu"},
    {file = "xlstm_plus/blocks/slstm/src/cuda/*.cuh"},
    {file = "xlstm_plus/blocks/slstm/src/util/*.c"},
    {file = "xlstm_plus/blocks/slstm/src/util/*.cc"},
    {file = "xlstm_plus/blocks/slstm/src/util/*.h"},
    {file = "xlstm_plus/blocks/slstm/src/util/*.cu"},
    {file = "xlstm_plus/blocks/slstm/src/util/*.cuh"},
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
  # { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]


[tool.scikit-build]
minimum-version = "build-system.requires"


[tool.setuptools.packages.find]
include = ["xlstm_plus*"]

[tool.setuptools.package-data]
"xlstm_plus" = ["blocks/slstm/src/cuda/*.c", "blocks/slstm/src/cuda/*.cc", "blocks/slstm/src/cuda/*.h", "blocks/slstm/src/cuda/*.cu", "blocks/slstm/src/cuda/*.cuh", "blocks/slstm/src/util/*.c", "blocks/slstm/src/util/*.cc", "blocks/slstm/src/util/*.h", "blocks/slstm/src/util/*.cu", "blocks/slstm/src/util/*.cuh"]

[project.urls]
Repository = "https://github.com/LeZeez/xlstm-plus"
Issues = "https://github.com/LeZeez/xlstm-plus/issues"
