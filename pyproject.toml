[build-system]
requires = [
  "scikit-build-core>=0.11",
  "pybind11>=3.0",
  "numpy>=2.0",
]
# NOTE: torch is intentionally NOT a build requirement. It is only needed at
# build time when the CUDA sLSTM extension is compiled (CUDAToolkit present).
# Listing it here forces isolated builds (pip/uv default) to download the CUDA
# torch wheel plus all nvidia-* dependencies, which is wrong on ROCm/CPU-only
# machines. When building with a CUDA toolchain, install torch into the build
# environment and use --no-build-isolation.
build-backend = "scikit_build_core.build"

[project]
name = "xlstm"
version = "2.0.5"
authors = [
  { name="Maximilian Beck", email="beck@ml.jku.at" },
  { name="Korbinian Poeppel", email="poeppel@ml.jku.at" },
  { name="Andreas Auer", email="auer@ml.jku.at" },
]
description = "A novel LSTM variant with promising performance compared to Transformers or State Space Models."
readme = "README.md"
license = {file="LICENSE"}
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
keywords = ["LSTM", "Transformer", "Machine Learning", "Deep Learning", "State Space Models"]
# torch is NOT a base dependency: its CUDA, ROCm and CPU builds live on
# separate PyTorch wheel indexes and there is no way to auto-select the right
# one here, so pinning it would force a CUDA build (and the nvidia-* stack)
# onto ROCm/CPU machines. Install a backend extra plus the matching index, e.g.
#   pip install "xlstm[rocm]" --extra-index-url https://download.pytorch.org/whl/rocm6.2
#   pip install "xlstm[cuda]" --extra-index-url https://download.pytorch.org/whl/cu126
#   pip install "xlstm[cpu]"  --extra-index-url https://download.pytorch.org/whl/cpu
# or just have torch already installed for your platform.
dependencies = [
    "einops",
    "numpy",
    "opt_einsum",
    "omegaconf",
    "transformers",
    "reportlab",
    "joypy",
    "ipykernel",
    "dacite",
    "ftfy",
    "ninja",
    "huggingface-hub",
    "rich",
    "tokenizers",
    "tqdm",
    "seaborn",
    "mlstm_kernels; python_version >= '3.11'",
]

[project.optional-dependencies]
cuda = ["torch>=2.0"]
rocm = ["torch>=2.0"]
cpu  = ["torch>=2.0"]

[tool.uv]
cache-keys = [
    {file = "pyproject.toml"},
    {file = "CMakeLists.txt"},
    {file = "blocks/slstm/src/cuda/*.c"},
    {file = "blocks/slstm/src/cuda/*.cc"},
    {file = "blocks/slstm/src/cuda/*.h"},
    {file = "blocks/slstm/src/cuda/*.cu"},
    {file = "blocks/slstm/src/cuda/*.cuh"},
    {file = "blocks/slstm/src/util/*.c"},
    {file = "blocks/slstm/src/util/*.cc"},
    {file = "blocks/slstm/src/util/*.h"},
    {file = "blocks/slstm/src/util/*.cu"},
    {file = "blocks/slstm/src/util/*.cuh"},
]



[tool.scikit-build]
minimum-version = "build-system.requires"


[tool.setuptools.package-data]
"xlstm" = ["blocks/slstm/src/cuda/*.c", "blocks/slstm/src/cuda/*.cc", "blocks/slstm/src/cuda/*.h", "blocks/slstm/src/cuda/*.cu", "blocks/slstm/src/cuda/*.cuh", "blocks/slstm/src/util/*.c", "blocks/slstm/src/util/*.cc", "blocks/slstm/src/util/*.h", "blocks/slstm/src/util/*.cu", "blocks/slstm/src/util/*.cuh"]

[project.urls]
Repository = "https://github.com/NX-AI/xlstm"
Issues = "https://github.com/NX-AI/xlstm/issues"
